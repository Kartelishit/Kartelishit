
name: Update code pet

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths: [".github/scripts/generate-pet.mjs"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/generate-pet.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "code-pet[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add code-pet.svg
          git diff --cached --quiet || git commit -m "Update coding pet"
          git push

