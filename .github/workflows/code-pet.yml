
name: Update code pet

'on':
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate coding pet
        run: node .github/scripts/generate-pet.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated SVG
        run: |
          git config user.name "code-pet[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add code-pet.svg
          git diff --cached --quiet || git commit -m "Update coding pet"
          git push


