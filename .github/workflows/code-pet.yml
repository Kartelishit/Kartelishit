
name: Update code pet

'on':
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

  push:
    paths:
      - '.github/scripts/generate-pet.mjs'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Byte
        run: node .github/scripts/generate-pet.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated SVG
        run: |
          git config user.name "code-pet[bot]"
          git config user.email "actions@users.noreply.github.com"

          git add code-pet.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update coding pet"
            git push
          else
            echo "No changes to commit."
          fi

